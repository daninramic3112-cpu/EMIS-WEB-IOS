
name: EMIS

options:
  bundleIdPrefix: com.daninramic
  deploymentTarget:
    iOS: "16.0"

targets:
  EMIS:
    type: application
    platform: iOS

    sources:
      - path: EMISApp.swift
      - path: ContentView.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daninramic.emis
        PRODUCT_NAME: EMIS
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: EMIS
